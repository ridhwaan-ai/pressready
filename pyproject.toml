[project]
name = "pressready"
version = "0.0.1"
description = "Manuscript in, publish-ready book out: EPUB, print interior PDF and wrap cover for AI agents."
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "ai-agents", "kdp", "epub", "book-publishing", "pdf", "self-publishing"]
requires-python = ">=3.11"
dependencies = ["reportlab>=4.0", "pillow", "mcp>=1.2,<2", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest", "pypdf", "httpx"]

[project.scripts]
pressready = "pressready.cli:main"
pressready-mcp = "pressready.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pressready = ["fonts/*.ttf", "fonts/OFL.txt"]
