[project]
name = "pressready"
version = "0.0.1"
description = "Manuscript in, publish-ready book out: EPUB, print interior PDF and wrap cover for AI agents."
requires-python = ">=3.11"
dependencies = ["reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest", "pypdf"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
